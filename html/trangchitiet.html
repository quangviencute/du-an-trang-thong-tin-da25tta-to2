<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <link rel="stylesheet" href="../css/style5.css">
</head>
<body class="bg-dark text-light py-5"> 

<div class="container my-5" id="main-container">
    <div class="card bg-secondary text-white p-4 shadow-lg" style="border: 2px solid #dc3545; background-color: rgba(20, 20, 20, 0.9) !important;">
        <div class="row g-4 align-items-center">
            <div class="col-md-5 text-center">
                <img src="" alt="" id="image" class="img-fluid rounded shadow" style="max-height: 400px; object-fit: cover;">
            </div>
            <div class="col-md-7">
                <h1 id="name" class="text-danger fw-bold mb-3"></h1>
                <h3 id="price" class="text-warning mb-4"></h3>
                
                <p id="description" class="lead text-light mb-4" style="text-align: justify;"></p>
                
                <div class="border-top border-danger pt-3 mt-3 mb-4">
                    <h5 class="text-danger fw-bold mb-2">Thông số kỹ thuật:</h5>
                    <p id="details" class="text-light-50 lh-lg" style="font-size: 0.95rem;"></p>
                </div>
                
                <a href="page9.html" class="btn btn-outline-danger px-4 py-2">Quay lại</a>
            </div>
        </div>
    </div>
</div>

<script src="../js/a1.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const foundProduct = products.find(obj => obj.id === productId);

    if (foundProduct) {
        document.getElementById('name').innerText = foundProduct.name;
        document.getElementById('price').innerText = foundProduct.price + "k/mô hình"; 
        document.getElementById('description').innerText = foundProduct.description;
        document.getElementById('image').src = foundProduct.image;
        document.getElementById('image').alt = foundProduct.name;
        
        // CẬP NHẬT: Đổ dữ liệu chi tiết vào giao diện
        // Dùng innerHTML để web nhận diện được các thẻ bôi đậm <b> hoặc xuống dòng <br> từ file dữ liệu
        if (foundProduct.details) {
            document.getElementById('details').innerHTML = foundProduct.details;
        } else {
            document.getElementById('details').innerText = "Đang cập nhật...";
        }
    } else {
        document.getElementById("main-container").innerHTML = `
            <div class="alert alert-danger text-center my-5" role="alert">
                <h2 class="alert-heading">Sản phẩm không tồn tại hoặc đã bị xóa!</h2>
                <hr>
                <a href="page9.html" class="btn btn-danger mt-3">Quay lại trang chủ</a>
            </div>`;
    }
</script>

</body>
</html>
