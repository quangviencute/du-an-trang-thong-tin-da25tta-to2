<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Hóa Đơn Mua Hàng</title>
    <link rel="stylesheet" href="../css/style3.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="invoice-box">
      <h1>Hóa Đơn Mua Hàng 🧺</h1>
      <table>
        <tr>
          <th>STT</th>
          <th>Tên</th>
          <th>Số lượng</th>
          <th>Đơn giá</th>
          <th>Đvt</th>
          <th>Thành tiền</th>
        </tr>

        <tr>
          <td>1</td>
          <td class="item-name">Coconut Water 🥥</td>
          <td class="soluong">20</td>
          <td class="dongia">40</td>
          <td>Hộp</td>
          <td class="thanhtien">?</td>
        </tr>

        <tr>
          <td>2</td>
          <td class="item-name">Que Diêm 🥖</td>
          <td class="soluong">400</td>
          <td class="dongia">10</td>
          <td>Hộp</td>
          <td class="thanhtien">?</td>
        </tr>
        <tr>
          <td>3</td>
          <td class="item-name">Gạo lứt 🌾</td>
          <td class="soluong">40</td>
          <td class="dongia">40</td>
          <td>Bịch</td>
          <td class="thanhtien">?</td>
        </tr>
        <tr class="total-row">
          <td colspan="5">Tổng thanh toán</td>
          <td id="thanhtoan">?</td>
        </tr>
      </table>
    </div>

    <script>
      const sl = document.getElementsByClassName("soluong");
      const dg = document.getElementsByClassName("dongia");
      const tt = document.getElementsByClassName("thanhtien");
      let tongthanhtoan = 0;
      for (let i = 0; i < sl.length; i++) {
        tt[i].innerHTML = Number(sl[i].innerHTML) * Number(dg[i].innerHTML);
        tongthanhtoan += Number(tt[i].innerHTML);
      }
      document.getElementById("thanhtoan").innerHTML = tongthanhtoan;
    </script>
  </body>
</html>
