<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title> Nhập dữ liệu promt ()và hiễn thị với alert()</title>
</head>
<body>
<script>
let name = prompt("Hãy nhập vào tên của bạn");
let yob = Number(prompt("Hãy nhập năm sinh của bạn"));
window.alert("Xin chào " + name + " ,năm 2026 bạn đã " + (2026-yob) + "  tuổi rồi đó .");
</script>
</body>
</html>
