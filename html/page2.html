<!doctype html>
<html lang="vi">
  <head>
    <title>Trang Đăng Nhập</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../css/style1.css" />
  </head>
  <body>
    <div class="container">
      <form id="frmLogin">
        <h2 id="title">Login</h2>

        <div class="form-group">
          <label for="txtUsername">Username:</label>
          <input
            class="form-control"
            type="text"
            id="txtUsername"
            name="txtUsername"
            placeholder="Nhập tên của bạn..."
          />
        </div>

        <div class="form-group">
          <label for="txtPassword">Password:</label>
          <input
            class="form-control"
            type="password"
            id="txtPassword"
            name="txtPassword"
            placeholder="••••••••"
          />
        </div>

        <div class="button-group">
          <input
            class="form-button btn-submit"
            type="submit"
            id="sbLogin"
            name="sbLogin"
            value="Login"
          />
          <input
            class="form-button btn-reset"
            type="reset"
            id="rsCancel"
            name="rsCancel"
            value="Cancel"
          />
        </div>
      </form>
    </div>
  </body>
</html>
