<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title> Tính diện tích hình chữ nhật</title>
</head>
<body>
<script>
let d = Number(prompt("Hãy nhập vào chiều dài "));
let r = Number(prompt("Hãy nhập vào chiều rộng"));
if(d<r)
alert("Chiều dài phải nhỏ hơn chiều rộng");
else
if(d==r)
alert("Trường hợp sít rịt :"+ d*r);
else 
alert("Diện tích hình chữ nhật là :" + d*r);

</script>
</body>
</html>
